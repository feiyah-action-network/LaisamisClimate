<title>Page Retired · Laisamis Climate &amp; Land Initiative</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --ink: #0f1a10; --ground: #1b3a2d; --amber: #c17f24; --amber-lt: #e8a83a;
    --parch: #f5efe0;
    --ff-display: 'Fraunces', Georgia, serif;
    --ff-body: 'DM Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--ff-body);
    background: var(--ground);
    color: var(--parch);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 38px, rgba(255,255,255,0.03) 38px, rgba(255,255,255,0.03) 39px),
      repeating-linear-gradient(90deg, transparent, transparent 38px, rgba(255,255,255,0.02) 38px, rgba(255,255,255,0.02) 39px);
  }
  .notice { max-width: 560px; text-align: center; animation: riseIn 0.8s cubic-bezier(0.16,1,0.3,1) both; }
  @keyframes riseIn { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
  .notice .tag {
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--amber-lt);
    display: block;
    margin-bottom: 1.2rem;
  }
  h1 {
    font-family: var(--ff-display);
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    font-weight: 600;
    line-height: 1.15;
    margin-bottom: 1.2rem;
  }
  h1 em { font-style: italic; font-weight: 300; color: rgba(245,239,224,0.65); }
  p { font-size: 0.95rem; color: rgba(245,239,224,0.72); line-height: 1.7; margin-bottom: 1rem; }
  .btn {
    display: inline-block;
    margin-top: 1rem;
    background: var(--amber);
    color: var(--ink);
    font-size: 0.9rem;
    font-weight: 500;
    padding: 0.72rem 1.6rem;
    border-radius: 4px;
    text-decoration: none;
    transition: background 0.25s ease, transform 0.25s cubic-bezier(0.16,1,0.3,1);
  }
  .btn:hover { background: var(--amber-lt); transform: translateY(-2px); }
  @media (prefers-reduced-motion: reduce) { .notice { animation: none; } }
</style>
</head>
<body>
 <div class="notice">
 <span class="tag">LCLI · Laisamis</span>
 <h1>This page has been retired.<br><em>The movement continues.</em></h1>
 <p>The work of the Laisamis Climate and Land Initiative is land justice and climate resilience: registering community land, training land paralegals, and building adaptation owned by the communities of Laisamis.</p>
 <a class="btn" href="index.html">Go to the main site</a>
 </div>
